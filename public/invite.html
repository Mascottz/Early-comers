<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Private invite · Attendance by ProofsTech</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #173f35;
        background: #f5f1e8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 12% 18%, rgba(238, 120, 79, .16), transparent 34%),
          radial-gradient(circle at 86% 82%, rgba(239, 201, 109, .23), transparent 38%),
          #f5f1e8;
      }
      main {
        width: min(460px, 100%);
        background: #fffdf7;
        border: 1px solid #d5d2c6;
        border-radius: 52px 74px 46px 68px / 58px 46px 70px 52px;
        box-shadow: 14px 18px 0 #eae4d8;
        padding: 46px 38px;
        text-align: center;
      }
      .mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 24px;
        border-radius: 46% 54% 51% 49% / 54% 43% 57% 46%;
        background: #173f35;
        color: #f5f1e8;
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
        font-size: 25px;
        font-weight: 700;
        transform: rotate(-4deg);
      }
      p.eyebrow {
        margin: 0 0 14px;
        font-size: 9px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: #52655d;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -.045em;
      }
      h1 em { color: #ca5939; font-style: normal; }
      p.detail {
        margin: 0 0 25px;
        font-size: 13px;
        line-height: 1.65;
        color: #52655d;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 40px;
        background: #173f35;
        color: #fffdf7;
        font-size: 11px;
        letter-spacing: .03em;
      }
      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #efc96d;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }
      a.fallback {
        display: inline-block;
        margin-top: 22px;
        padding-bottom: 4px;
        border-bottom: 1px solid currentColor;
        color: #173f35;
        font-size: 11px;
        text-decoration: none;
      }
      a.fallback[hidden] { display: none; }
      small.footnote {
        display: block;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid #d5d2c6;
        color: #52655d;
        font-size: 9px;
        line-height: 1.6;
      }
    </style>
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <p class="eyebrow">PRIVATE INVITE · PROOFSTECH</p>
      <h1 id="title">Opening your <em>invite.</em></h1>
      <p class="detail" id="detail">Checking this private link and signing you in securely.</p>
      <span class="status" id="status">One moment…</span>
      <a class="fallback" id="fallback" href="/" hidden>Open Attendance</a>
      <small class="footnote">This link is personal to you. It signs you in automatically, works once, and expires after one hour.</small>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const token = params.get('token') || params.get('hashed_token')
      const type = params.get('type') || 'magiclink'
      const config = window.ATTENDANCE_CONFIG || {}
      const title = document.getElementById('title')
      const detail = document.getElementById('detail')
      const status = document.getElementById('status')
      const fallback = document.getElementById('fallback')

      if (!token || !config.supabaseUrl) {
        title.innerHTML = 'This invite is <em>incomplete.</em>'
        detail.textContent = 'The link is missing its private token. Ask an admin to prepare a fresh link.'
        status.textContent = 'Link not valid'
        fallback.hidden = false
      } else {
        const verifyUrl =
          config.supabaseUrl +
          '/auth/v1/verify?token=' + encodeURIComponent(token) +
          '&type=' + encodeURIComponent(type) +
          '&redirect_to=' + encodeURIComponent(window.location.origin)
        status.textContent = 'Signing you in…'
        window.location.replace(verifyUrl)
      }
    </script>
  </body>
</html>
