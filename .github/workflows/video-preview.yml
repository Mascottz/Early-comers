name: Video preview stills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video/**'
      - '.github/workflows/video-preview.yml'

permissions:
  contents: write

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        working-directory: video
        run: npm ci

      - name: Install headless Chrome
        working-directory: video
        run: npx remotion browser ensure

      - name: Render stills
        working-directory: video
        run: |
          mkdir -p out/preview
          for f in 60 315 884; do
            npx remotion still src/index.ts InstallVideo "out/preview/install-$f.png" --frame=$f --image-format=png
          done
          for f in 40 200 352 570 823 923 1194 1430 1676 1975 2100; do
            npx remotion still src/index.ts AdVideo "out/preview/ad-$f.png" --frame=$f --image-format=png
          done

      - name: Publish stills to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan video-preview
          git reset
          git add -f video/out/preview
          git commit -m "Video preview stills"
          git push --force origin video-preview
